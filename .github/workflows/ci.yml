# CI for jxldec — host build, amalgamation, and pixel-oracle tests against
# libjxl on Windows, Linux, and macOS. Also covers the cross/arch compile
# variants that have failed consumers before (MSVC Win32, mingw-w64).
#
# `bun cmd/tests.ts -all` needs the full deps tree (libjxl tools + generated
# corpus). deps/ is cached per OS/arch so cold runs pay the clone/build/encode
# cost once and warm runs stay short.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache

jobs:
  windows-msvc:
    name: Windows MSVC x64 + tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure clang-cl on PATH
        # get-deps builds the libjxl oracle with clang-cl.
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) { exit 0 }
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin"
          )
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d "clang-cl.exe")) {
              echo $d | Out-File -FilePath $env:GITHUB_PATH -Append
              exit 0
            }
          }
          choco install llvm -y --no-progress
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-windows-x64-${{ hashFiles('cmd/get-deps.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-windows-x64-
      - name: Oracle tests (MSVC)
        run: bun cmd/tests.ts -all
      - name: Amalgamation (clang + msvc + msvc-x86)
        # -require-msvc-x86 uses HostX64/x86/cl when the PATH cl is x64, so we
        # catch Win32-only breaks (_BitScanReverse64) on the same job.
        run: bun cmd/build-dist.ts -require-msvc-x86

  windows-msvc-x86:
    name: Windows MSVC Win32 + tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Build the oracle tools as x64 (clang-cl host tools). The harness below
      # is Win32; the two only exchange PAM files, so arch need not match.
      - name: MSVC environment (x64) for oracle tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Ensure clang-cl on PATH
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) { exit 0 }
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin"
          )
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d "clang-cl.exe")) {
              echo $d | Out-File -FilePath $env:GITHUB_PATH -Append
              exit 0
            }
          }
          choco install llvm -y --no-progress
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          # Share the x64 oracle/corpus cache with the main Windows job.
          key: deps-v1-windows-x64-${{ hashFiles('cmd/get-deps.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-windows-x64-
      - name: Build libjxl oracle (x64)
        run: bun cmd/get-deps.ts
      - name: MSVC environment (x86) for harness
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Oracle tests under Win32 cl
        # Full link of jxl_test under x86 — the SumatraPDF rel32 failure was
        # LNK2001 on __BitScanReverse64, not only a compile warning. tests.ts
        # rebuilds the harness with the current cl.
        run: bun cmd/tests.ts -all
      - name: Amalgamation under Win32 cl
        run: bun cmd/build-dist.ts

  linux:
    name: Linux clang + tests + mingw
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build gcc-mingw-w64-x86-64
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-linux-${{ hashFiles('cmd/get-deps.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-linux-
      - name: Oracle tests (clang)
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation (clang + mingw without -mxsave)
        # mingw must not need -mxsave: that is how SumatraPDF Wine CI compiles
        # jxl.c. gcc's _xgetbv is always_inline and fails without it.
        run: bun cmd/build-dist.ts -require-mingw

  macos:
    name: macOS clang + tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: System packages
        run: brew install cmake ninja
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-v1-macos-${{ hashFiles('cmd/get-deps.ts', 'cmd/corpus.ts') }}
          restore-keys: |
            deps-v1-macos-
      - name: Oracle tests (clang)
        # Apple clang is on the runner; -clang is the default off Windows but
        # keep it explicit so this job stays parallel to linux.
        run: bun cmd/tests.ts -all -clang
      - name: Amalgamation (host clang)
        run: bun cmd/build-dist.ts
